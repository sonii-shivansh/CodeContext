name: Vericore Migration Executor

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: startsWith(github.event.pull_request.head.ref, 'refactor/vericore-migration') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute MCP and server identity migration
        shell: bash
        run: |
          set -euo pipefail
          if test -f .vericore-migration-phase5-complete; then exit 0; fi
          test -f .vericore-migration-phase4-complete
          python3 - <<'PY'
          from pathlib import Path
          root=Path.cwd()
          mcp=root/'src/main/kotlin/com/vericore/mcp/McpProtocol.kt'
          s=mcp.read_text(encoding='utf-8')
          s=s.replace('codecontext_', 'vericore_')
          old='val name = params["name"]?.jsonPrimitive?.content ?: return errorResponse(id, -32602, "Missing tool name"); val args = params["arguments"]?.jsonObject ?: buildJsonObject {}; return try { resultResponse(id, when (name) {'
          new='val rawName = params["name"]?.jsonPrimitive?.content ?: return errorResponse(id, -32602, "Missing tool name"); val name = if (rawName.startsWith("codecontext_")) { System.err.println("⚠️ Deprecated MCP tool name \'$rawName\' used; use \'vericore_\' equivalent."); rawName.replaceFirst("codecontext_", "vericore_") } else rawName; val args = params["arguments"]?.jsonObject ?: buildJsonObject {}; return try { resultResponse(id, when (name) {'
          if old in s: s=s.replace(old,new)
          mcp.write_text(s,encoding='utf-8')
          server=root/'src/main/kotlin/com/vericore/server/VericoreServer.kt'
          s=server.read_text(encoding='utf-8')
          old='val configured = System.getenv("VERICORE_ALLOWED_PATHS")'
          new='val configured = System.getenv("VERICORE_ALLOWED_PATHS") ?: System.getenv("CODECONTEXT_ALLOWED_PATHS")?.also { System.err.println("⚠️ Deprecated CODECONTEXT_ALLOWED_PATHS is in use; replace it with VERICORE_ALLOWED_PATHS.") }'
          s=s.replace(old,new)
          server.write_text(s,encoding='utf-8')
          for p in [root/'README.md',root/'CONTRIBUTING.md',root/'SECURITY.md',root/'docs']:
              ps=[p] if p.is_file() else ([x for x in p.rglob('*') if x.is_file()] if p.is_dir() else [])
              for f in ps:
                  if f.name in {'CHANGELOG.md','VERICORE_MIGRATION_SPEC.md','VERICORE_MIGRATION_PLAN.md'}: continue
                  try:a=f.read_text(encoding='utf-8')
                  except (UnicodeDecodeError,OSError):continue
                  b=a.replace('__VERICORE_EXTERNAL_VERICORE_WEBSITE__','CodeContext-Website').replace('__VERICORE_EXTERNAL_CODECONTEXT_WEBSITE__','CodeContext-Website')
                  if a!=b:f.write_text(b,encoding='utf-8')
          PY
          rm -f .vericore-phase4-trigger
          rm -f .vericore-migration-phase4-complete
          touch .vericore-migration-phase5-complete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -s -m 'refactor: migrate MCP and server identity to Vericore'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
