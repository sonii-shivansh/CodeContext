name: Live E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  real-repository:
    name: Complete live repository E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}

    steps:
      - name: Checkout CodeContext
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build and test CodeContext
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist

      - name: Verify complete CLI surface
        run: |
          CLI=./build/install/codecontext/bin/codecontext
          "$CLI" --version
          "$CLI" --help
          "$CLI" setup --help
          "$CLI" doctor --help
          "$CLI" analyze --help
          "$CLI" impact --help
          "$CLI" architecture --help
          "$CLI" architecture-drift --help
          "$CLI" architecture-contract --help
          "$CLI" context-snapshot --help
          "$CLI" context-diff --help
          "$CLI" pr-intelligence --help
          "$CLI" repo-qa --help
          "$CLI" plan --help
          "$CLI" prepare --help
          "$CLI" verify --help
          "$CLI" ask --help
          "$CLI" evolution --help
          "$CLI" server --help
          "$CLI" mcp --help

      - name: Clone canonical live repository
        run: |
          rm -rf "$RUNNER_TEMP/real-project"
          git clone --depth 50 https://github.com/spring-projects/spring-petclinic.git "$RUNNER_TEMP/real-project"
          cd "$RUNNER_TEMP/real-project"
          git log -5 --oneline
          test -d .git
          test -n "$(find src -type f -name '*.java' | head -1)"

      - name: Run complete CLI and change-safety journey
        working-directory: ${{ runner.temp }}/real-project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          chmod +x "$GITHUB_WORKSPACE/.github/scripts/live-e2e.sh"
          "$GITHUB_WORKSPACE/.github/scripts/live-e2e.sh" "$CLI" "$PWD"

      - name: Run MCP protocol journey against packaged CLI
        working-directory: ${{ runner.temp }}/real-project
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          export MCP_EVIDENCE="$PWD/output/mcp-responses.json"
          python3 "$GITHUB_WORKSPACE/.github/scripts/mcp-smoke.py" "$CLI" "$PWD"

      - name: Start REST server
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/real-project
        shell: bash
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" server --host 127.0.0.1 --port 18080 > server.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > health.json; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Verify complete REST contract
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/real-project
        shell: bash
        run: |
          curl --fail --silent http://127.0.0.1:18080/ | grep -F "CodeContext API is running"
          curl --fail --silent http://127.0.0.1:18080/health | grep -F '"status":"healthy"'
          curl --fail --silent http://127.0.0.1:18080/health/live | grep -F '"status":"live"'
          curl --fail --silent http://127.0.0.1:18080/health/ready | grep -F '"status":"ready"'

          curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"repoPath":"."}' \
            http://127.0.0.1:18080/analyze > output/rest-analyze.json
          curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"repoPath":"."}' \
            http://127.0.0.1:18080/architecture > output/rest-architecture.json
          curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"repoPath":".","baseRevision":"HEAD~1","headRevision":"HEAD"}' \
            http://127.0.0.1:18080/pr-intelligence > output/rest-pr-intelligence.json

          test -s output/rest-analyze.json
          test -s output/rest-architecture.json
          test -s output/rest-pr-intelligence.json

          status=$(curl --silent --output /tmp/traversal.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":"/tmp/../etc"}' \
            http://127.0.0.1:18080/analyze)
          test "$status" = "400"

          status=$(curl --silent --output /tmp/remote.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":"https://example.com/repo"}' \
            http://127.0.0.1:18080/analyze)
          test "$status" = "400"

      - name: Validate complete evidence bundle
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}/real-project
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/live-e2e-assertions.py" "$PWD"

      - name: Live Gemini integration
        if: ${{ env.HAS_GEMINI == 'true' }}
        working-directory: ${{ runner.temp }}/real-project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        timeout-minutes: 5
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          set +e
          "$CLI" ask "Give a concise evidence-grounded overview of this repository's architecture and identify two files I should inspect first." 2>&1 | tee output/live-gemini-ask.txt
          status=${PIPESTATUS[0]}
          set -e
          test -s output/live-gemini-ask.txt
          if grep -Eiq 'HTTP[[:space:]]*429|quota[^[:alnum:]]*(exceeded|exhausted)|rate[[:space:]-]*limit|RESOURCE_EXHAUSTED' output/live-gemini-ask.txt; then
            printf 'status=skipped\nreason=Gemini provider quota or rate limit exhausted\n' > output/live-gemini-status.txt
            echo "::warning::Gemini provider quota/rate limit exhausted; deterministic live E2E remains authoritative."
          elif [ "$status" -eq 0 ]; then
            ! grep -q "AI features disabled" output/live-gemini-ask.txt
            grep -q '💡' output/live-gemini-ask.txt
            grep -q '🎯 Confidence:' output/live-gemini-ask.txt
            printf 'status=passed\n' > output/live-gemini-status.txt
          else
            echo "Live Gemini integration failed for a non-quota reason."
            exit "$status"
          fi

      - name: Stop REST server
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "$RUNNER_TEMP/real-project/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/real-project/server.pid")" || true
          fi

      - name: Upload complete live evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codecontext-live-complete-e2e
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/real-project/output/
            ${{ runner.temp }}/real-project/doctor.txt
            ${{ runner.temp }}/real-project/server.log
            ${{ runner.temp }}/real-project/health.json
