name: Live E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  real-repository:
    name: Real repository E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}

    steps:
      - name: Checkout CodeContext
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build CodeContext
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist

      - name: Verify CLI surface
        run: |
          CLI=./build/install/codecontext/bin/codecontext
          "$CLI" --version
          "$CLI" --help
          "$CLI" setup --help
          "$CLI" doctor --help
          "$CLI" analyze --help
          "$CLI" impact --help
          "$CLI" architecture --help
          "$CLI" architecture-drift --help
          "$CLI" architecture-contract --help
          "$CLI" context-snapshot --help
          "$CLI" context-diff --help
          "$CLI" pr-intelligence --help
          "$CLI" repo-qa --help
          "$CLI" plan --help
          "$CLI" prepare --help
          "$CLI" verify --help
          "$CLI" ask --help
          "$CLI" evolution --help
          "$CLI" server --help
          "$CLI" mcp --help

      - name: Clone real Git project
        run: |
          rm -rf "$RUNNER_TEMP/real-project"
          git clone --depth 50 https://github.com/spring-projects/spring-petclinic.git "$RUNNER_TEMP/real-project"
          cd "$RUNNER_TEMP/real-project"
          git log -5 --oneline
          test -d .git
          test -n "$(find src -type f -name '*.java' | head -1)"

      - name: Diagnose real project
        working-directory: ${{ runner.temp }}/real-project
        run: |
          "$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext" doctor | tee doctor.txt
          grep -q "CodeContext doctor" doctor.txt
          grep -q "Repository" doctor.txt

      - name: Analyze real project
        working-directory: ${{ runner.temp }}/real-project
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" analyze .
          test -s output/index.html
          test -s output/analysis-snapshot.json
          test -s output/engineering-risks.json

      - name: Architecture and impact intelligence
        working-directory: ${{ runner.temp }}/real-project
        shell: bash
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" architecture . --json
          test -s output/architecture.json
          SOURCE_FILE="$(find src -type f -name '*.java' | head -1)"
          "$CLI" impact . "$SOURCE_FILE" --json
          test -s output/impact.json

      - name: Architecture drift and contract
        working-directory: ${{ runner.temp }}/real-project
        shell: bash
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          cp output/architecture.json output/architecture-baseline.json
          "$CLI" architecture-drift . --baseline output/architecture-baseline.json --json
          test -s output/architecture-drift.json
          cat > .codecontext-architecture-contract.json <<'JSON'
          {
            "schemaVersion": "1.0",
            "maxFindings": 100000,
            "maxCycles": 100000,
            "allowedSeverities": ["LOW", "MEDIUM", "HIGH", "CRITICAL"],
            "requiredRules": []
          }
          JSON
          "$CLI" architecture-contract . --json
          test -s output/architecture-contract.json
          rm -f .codecontext-architecture-contract.json

      - name: Engineering context snapshots
        working-directory: ${{ runner.temp }}/real-project
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" context-snapshot . --json
          test -s output/engineering-context.json
          cp output/engineering-context.json output/engineering-context-baseline.json
          "$CLI" context-diff output/engineering-context-baseline.json output/engineering-context.json --json
          test -s output/engineering-context-diff.json

      - name: Git history and PR intelligence
        working-directory: ${{ runner.temp }}/real-project
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" evolution .
          test -s output/evolution.json
          "$CLI" pr-intelligence . --base HEAD~1 --head HEAD --json
          test -s output/pr-intelligence.json

      - name: Grounded Q&A and engineering preparation
        working-directory: ${{ runner.temp }}/real-project
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" repo-qa "Which files are the main architectural hotspots?" --path . --evidence-output output/grounded-evidence.json > output/repo-qa.json
          test -s output/repo-qa.json
          test -s output/grounded-evidence.json
          "$CLI" plan "Improve the repository safely" --evidence output/grounded-evidence.json --output output/engineering-plan.json
          test -s output/engineering-plan.json
          "$CLI" prepare "Improve the repository safely"
          test -s output/engineering-context.json
          test -s output/engineering-plan.json

      - name: Verification workflow on real project
        working-directory: ${{ runner.temp }}/real-project
        run: |
          "$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext" verify --output output/verify.json
          test -s output/verify.json

      - name: Live Gemini repository Q&A
        if: ${{ env.HAS_GEMINI == 'true' }}
        working-directory: ${{ runner.temp }}/real-project
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" ask "Give a concise evidence-grounded overview of this repository's architecture and identify two files I should inspect first." | tee output/live-gemini-ask.txt
          test -s output/live-gemini-ask.txt
          ! grep -q "AI features disabled" output/live-gemini-ask.txt

      - name: Start REST server
        working-directory: ${{ runner.temp }}/real-project
        shell: bash
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/codecontext/bin/codecontext"
          "$CLI" server --host 127.0.0.1 --port 18080 > server.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health > health.json; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Verify REST API against real project
        working-directory: ${{ runner.temp }}/real-project
        run: |
          curl --fail --silent http://127.0.0.1:18080/ | grep -F "CodeContext API is running"
          curl --fail --silent http://127.0.0.1:18080/health | grep -F '"status":"healthy"'
          curl --fail --silent -H 'Content-Type: application/json' -d '{"repoPath":"."}' http://127.0.0.1:18080/architecture > output/rest-architecture.json
          test -s output/rest-architecture.json
          status=$(curl --silent --output /tmp/traversal.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"repoPath":"/tmp/../etc"}' http://127.0.0.1:18080/analyze)
          test "$status" = "400"

      - name: Stop REST server
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "$RUNNER_TEMP/real-project/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/real-project/server.pid")" || true
          fi

      - name: Upload complete E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codecontext-live-e2e
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/real-project/output/
            ${{ runner.temp }}/real-project/doctor.txt
            ${{ runner.temp }}/real-project/server.log
