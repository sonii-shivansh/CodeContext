name: Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and end-to-end verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit and property tests
        run: ./gradlew --no-daemon clean test

      - name: Run code quality checks
        run: ./gradlew --no-daemon ktlintCheck

      - name: Build application and distribution
        run: ./gradlew --no-daemon build installDist

      - name: Verify CLI
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext --help
          version="$(./build/install/codecontext/bin/codecontext --version)"
          test "$version" = "0.6.0"

      - name: Run self-analysis end-to-end
        run: |
          rm -rf output
          ./build/install/codecontext/bin/codecontext analyze .
          test -s output/index.html
          test -s output/analysis-snapshot.json
          test -s output/engineering-risks.json

      - name: Validate generated intelligence artifacts
        shell: bash
        run: |
          grep -q "CodeContext Analysis Report" output/index.html
          grep -q "Knowledge Hotspots" output/index.html
          grep -q "Personalized Learning Path" output/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("output/analysis-snapshot.json").read_text())
          risks = json.loads(Path("output/engineering-risks.json").read_text())

          assert snapshot["schemaVersion"] == "1.0"
          assert snapshot["metrics"]["totalFiles"] > 0
          assert snapshot["metrics"]["totalNodes"] >= snapshot["metrics"]["totalFiles"]
          assert isinstance(snapshot["hotspots"], list)
          assert isinstance(risks, list)
          assert all(0 <= item["score"] <= 100 for item in risks)
          print(f"Validated {snapshot['metrics']['totalFiles']} files and {len(risks)} risk records")
          PY

      - name: Verify repository Q&A and engineering plan
        shell: bash
        run: |
          rm -f output/grounded-evidence.json output/engineering-plan.json
          ./build/install/codecontext/bin/codecontext repo-qa "which files are the main architectural hotspots?" --path . > output/grounded-evidence.json
          test -s output/grounded-evidence.json
          ./build/install/codecontext/bin/codecontext plan "improve the repository safely" --evidence output/grounded-evidence.json --output output/engineering-plan.json
          test -s output/engineering-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("output/grounded-evidence.json").read_text())
          plan = json.loads(Path("output/engineering-plan.json").read_text())
          assert isinstance(evidence, dict)
          assert isinstance(plan, dict)
          print("Repository Q&A and engineering planning validated")
          PY

      - name: Verify PR Intelligence CLI
        shell: bash
        run: |
          rm -f output/pr-intelligence.json
          ./build/install/codecontext/bin/codecontext pr-intelligence . --base HEAD~1 --head HEAD --json
          test -s output/pr-intelligence.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("output/pr-intelligence.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert result["changeSummary"]["filesChanged"] >= 1
          assert result["aggregateSeverity"] in {"INFO", "LOW", "MEDIUM", "HIGH", "CRITICAL"}
          print(f"PR Intelligence validated: {result['changeSummary']['filesChanged']} changed files")
          PY

      - name: Verify Architecture Intelligence CLI
        shell: bash
        run: |
          rm -f output/architecture.json
          ./build/install/codecontext/bin/codecontext architecture . --json
          test -s output/architecture.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("output/architecture.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert result["summary"]["filesAnalyzed"] > 0
          assert isinstance(result["findings"], list)
          assert isinstance(result["cycles"], list)
          assert isinstance(result["layers"], dict)
          print(f"Architecture Intelligence validated: {result['summary']['findings']} findings")
          PY

      - name: Start server
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext server \
            --host 127.0.0.1 \
            --port 18080 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ > response.txt; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready."
          cat server.log
          exit 1

      - name: Verify API health and version contract
        shell: bash
        run: |
          grep -F "CodeContext API is running" response.txt
          health="$(curl --fail --silent http://127.0.0.1:18080/health)"
          echo "$health" | grep -F '"status":"healthy"'
          echo "$health" | grep -F '"version":"0.6.0"'
          curl --fail --silent http://127.0.0.1:18080/health/live | grep -F '"status":"live"'
          curl --fail --silent http://127.0.0.1:18080/health/ready | grep -F '"status":"ready"'

      - name: Verify API input security boundaries
        shell: bash
        run: |
          status=$(curl --silent --output /tmp/traversal.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":"/tmp/../etc"}' \
            http://127.0.0.1:18080/analyze)
          test "$status" = "400"
          status=$(curl --silent --output /tmp/remote.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":"https://example.com/repo"}' \
            http://127.0.0.1:18080/analyze)
          test "$status" = "400"
          status=$(curl --silent --output /tmp/revision.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":".","baseRevision":"HEAD~1"}' \
            http://127.0.0.1:18080/pr-intelligence)
          test "$status" = "400"

      - name: Verify PR Intelligence REST API
        shell: bash
        run: |
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":".","baseRevision":"HEAD~1","headRevision":"HEAD"}' \
            http://127.0.0.1:18080/pr-intelligence > pr-intelligence-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("pr-intelligence-response.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert "changeSummary" in result
          assert "findings" in result
          print("PR Intelligence REST endpoint validated")
          PY

      - name: Verify Architecture Intelligence REST API
        shell: bash
        run: |
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":"."}' \
            http://127.0.0.1:18080/architecture > architecture-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("architecture-response.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert result["summary"]["filesAnalyzed"] > 0
          assert "findings" in result
          assert "cycles" in result
          print("Architecture Intelligence REST endpoint validated")
          PY

      - name: Verify generated report is self-contained
        shell: bash
        run: |
          ! grep -q "unpkg.com" output/index.html
          ! grep -q '<script src=' output/index.html

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-verification
          if-no-files-found: ignore
          path: |
            output/
            server.log
            response.txt
            pr-intelligence-response.json
            architecture-response.json
