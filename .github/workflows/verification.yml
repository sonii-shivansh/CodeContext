name: Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and end-to-end verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Run unit and property tests
        run: ./gradlew --no-daemon clean test

      - name: Build application and distribution
        run: ./gradlew --no-daemon build installDist

      - name: Verify CLI
        run: |
          ./build/install/codecontext/bin/codecontext --help
          ./build/install/codecontext/bin/codecontext --version || true

      - name: Run self-analysis end-to-end
        run: |
          rm -rf output
          ./build/install/codecontext/bin/codecontext analyze .
          test -s output/index.html
          test -s output/analysis-snapshot.json
          test -s output/engineering-risks.json

      - name: Validate generated intelligence artifacts
        shell: bash
        run: |
          grep -q "CodeContext Analysis Report" output/index.html
          grep -q "Knowledge Hotspots" output/index.html
          grep -q "Personalized Learning Path" output/index.html
          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path("output/analysis-snapshot.json").read_text())
          risks = json.loads(Path("output/engineering-risks.json").read_text())

          assert snapshot["schemaVersion"] == "1.0"
          assert snapshot["metrics"]["totalFiles"] > 0
          assert snapshot["metrics"]["totalNodes"] >= snapshot["metrics"]["totalFiles"]
          assert isinstance(snapshot["hotspots"], list)
          assert isinstance(risks, list)
          assert all(0 <= item["score"] <= 100 for item in risks)
          print(f"Validated {snapshot['metrics']['totalFiles']} files and {len(risks)} risk records")
          PY

      - name: Verify PR Intelligence CLI
        shell: bash
        run: |
          rm -f output/pr-intelligence.json
          ./build/install/codecontext/bin/codecontext pr-intelligence . --base HEAD~1 --head HEAD --json
          test -s output/pr-intelligence.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("output/pr-intelligence.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert result["changeSummary"]["filesChanged"] >= 1
          assert result["aggregateSeverity"] in {"INFO", "LOW", "MEDIUM", "HIGH", "CRITICAL"}
          print(f"PR Intelligence validated: {result['changeSummary']['filesChanged']} changed files")
          PY

      - name: Start server
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext server \
            --host 127.0.0.1 \
            --port 18080 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ > response.txt; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready."
          cat server.log
          exit 1

      - name: Verify API health
        run: |
          grep -F "CodeContext API is running" response.txt
          curl --fail --silent http://127.0.0.1:18080/health | grep -F '"status":"healthy"'
          curl --fail --silent http://127.0.0.1:18080/health/live | grep -F '"status":"live"'
          curl --fail --silent http://127.0.0.1:18080/health/ready | grep -F '"status":"ready"'

      - name: Verify PR Intelligence REST API
        shell: bash
        run: |
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"repoPath":".","baseRevision":"HEAD~1","headRevision":"HEAD"}' \
            http://127.0.0.1:18080/pr-intelligence > pr-intelligence-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("pr-intelligence-response.json").read_text())
          assert result["schemaVersion"] == "1.0"
          assert "changeSummary" in result
          assert "findings" in result
          print("PR Intelligence REST endpoint validated")
          PY

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-verification
          if-no-files-found: ignore
          path: |
            output/
            server.log
            response.txt
            pr-intelligence-response.json
