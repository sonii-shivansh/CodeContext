name: Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Run tests
        run: ./gradlew --no-daemon clean test

      - name: Build application and distribution
        run: ./gradlew --no-daemon build installDist

      - name: Verify CLI help
        run: |
          ./build/install/codecontext/bin/codecontext --help
          ./build/install/codecontext/bin/codecontext --version || true

      - name: Run self-analysis smoke test
        run: |
          rm -rf output
          ./build/install/codecontext/bin/codecontext analyze .
          test -s output/index.html

      - name: Verify generated report
        run: |
          grep -q "CodeContext Analysis Report" output/index.html
          grep -q "Knowledge Hotspots" output/index.html
          grep -q "Personalized Learning Path" output/index.html

      - name: Start server
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext server \
            --host 127.0.0.1 \
            --port 18080 > server.log 2>&1 &

          echo $! > server.pid

      - name: Wait for server
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ > response.txt; then
              exit 0
            fi

            sleep 1
          done

          echo "Server did not become ready."
          cat server.log
          exit 1

      - name: Verify root endpoint
        run: |
          grep -F "CodeContext API is running" response.txt

      - name: Verify health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:18080/health > health.json
          grep -F '"status":"healthy"' health.json

      - name: Verify live health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:18080/health/live > live-health.json
          grep -F '"status":"live"' live-health.json

      - name: Verify ready health endpoint
        run: |
          curl --fail --silent http://127.0.0.1:18080/health/ready > ready-health.json
          grep -F '"status":"ready"' ready-health.json

      - name: Stop server
        if: always()
        shell: bash
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-verification
          if-no-files-found: ignore
          path: |
            output/
            server.log
            response.txt
            health.json
            live-health.json
            ready-health.json
