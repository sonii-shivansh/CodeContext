name: Phase 1 Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    name: Phase 1 repository correctness regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build Vericore
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build installDist

      - name: Test repository-scoped config, output location, and failure exit code
        shell: bash
        run: |
          set -u
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/src"
          cat > "$fixture/.vericore.json" <<'JSON'
          {"maxFilesAnalyze":1,"gitCommitLimit":1}
          JSON
          cat > "$fixture/src/One.java" <<'JAVA'
          class One {}
          JAVA
          cat > "$fixture/src/Two.java" <<'JAVA'
          class Two {}
          JAVA

          set +e
          "$CLI" architecture "$fixture" --json > /tmp/phase1-config.txt 2>&1
          status=$?
          set -e
          cat /tmp/phase1-config.txt
          test "$status" -ne 0
          grep -F "maximum file limit: 1" /tmp/phase1-config.txt
          test ! -e "$PWD/output/architecture.json"

      - name: Test repository-relative output from another working directory
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/src"
          cat > "$fixture/src/One.java" <<'JAVA'
          class One {}
          JAVA

          cd /tmp
          "$CLI" architecture "$fixture" --json
          test -s "$fixture/output/architecture.json"
          test ! -e "$OLDPWD/output/architecture.json"

      - name: Test truthful parse-failure propagation in analyze
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT

          mkdir -p "$fixture/src"
          cat > "$fixture/src/Good.java" <<'JAVA'
          class Good {}
          JAVA
          cat > "$fixture/src/Broken.java" <<'JAVA'
          class Broken {
          JAVA

          "$CLI" analyze "$fixture" --no-cache
          test -s "$fixture/output/analysis-snapshot.json"
          python3 - "$fixture/output/analysis-snapshot.json" <<'PY'
          import json
          import sys
          snapshot = json.load(open(sys.argv[1]))
          assert snapshot["metrics"]["parseFailures"] >= 1, snapshot
          PY

      - name: Test documented evolution repository argument
        shell: bash
        run: |
          set -euo pipefail
          CLI="$PWD/build/install/vericore/bin/vericore"
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          git -C "$fixture" init -q
          git -C "$fixture" config user.email "ci@example.com"
          git -C "$fixture" config user.name "CI"
          printf '%s\n' 'class EvolutionFixture {}' > "$fixture/EvolutionFixture.java"
          git -C "$fixture" add .
          git -C "$fixture" commit -qm "initial fixture"
          "$CLI" evolution "$fixture" --months 1 --interval 30
