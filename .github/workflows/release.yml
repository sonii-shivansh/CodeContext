name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.6.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve and verify release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle version matches release version
        shell: bash
        run: |
          declared="$(./gradlew -q properties | awk -F': ' '$1 == "version" {print $2; exit}')"
          test "$declared" = "${{ steps.version.outputs.version }}"

      - name: Run release test suite
        run: ./gradlew --no-daemon clean test

  package:
    name: Package ${{ matrix.name }}
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: windows-x64
            runner: windows-2025
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build distribution on Unix
        if: runner.os != 'Windows'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon installDist

      - name: Verify CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext --version | grep -F '${{ needs.resolve-version.outputs.version }}'

      - name: Build distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon installDist

      - name: Verify CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& .\build\install\codecontext\bin\codecontext.bat --version).Trim()
          if ($version -notmatch [regex]::Escape('${{ needs.resolve-version.outputs.version }}')) { throw "Unexpected version: $version" }

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION='${{ needs.resolve-version.outputs.version }}'
          tar -czf "codecontext-${VERSION}-${{ matrix.name }}.tar.gz" -C build/install codecontext

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.resolve-version.outputs.version }}'
          Compress-Archive -Path .\build\install\codecontext -DestinationPath "codecontext-$version-${{ matrix.name }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-${{ matrix.name }}
          path: codecontext-*-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve-version, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: codecontext-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum codecontext-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: CodeContext v${{ needs.resolve-version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/codecontext-*
            release-assets/SHA256SUMS
