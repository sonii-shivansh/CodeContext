name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.2.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon clean test

      - name: Build distribution
        run: ./gradlew --no-daemon build installDist

      - name: Verify installed CLI
        run: ./build/install/codecontext/bin/codecontext --help

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Linux distribution
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "codecontext-${VERSION}-linux.tar.gz" -C build/install codecontext

      - name: Package Windows-compatible ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build/install
          zip -r "../../codecontext-${VERSION}-windows.zip" codecontext

      - name: Generate checksums
        run: |
          sha256sum codecontext-*.tar.gz codecontext-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CodeContext v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            codecontext-*.tar.gz
            codecontext-*.zip
            SHA256SUMS
