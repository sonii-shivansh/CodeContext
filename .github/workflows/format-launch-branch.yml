name: Format launch branch

on:
  push:
    branches: [release/0.6.0-launch-hardening]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: auto-format') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Format Kotlin sources
        run: ./gradlew --no-daemon ktlintFormat

      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.gradle.kts
          git commit -m "chore: auto-format Kotlin sources"
          git push
