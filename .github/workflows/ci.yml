name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/test-results/
          if-no-files-found: ignore

  build-artifacts:
    name: Build Distribution
    runs-on: windows-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build distribution
        run: ./gradlew installDist

      - name: Verify installed CLI
        shell: pwsh
        run: |
          $version = (& .\build\install\codecontext\bin\codecontext.bat --version).Trim()
          if ($version -notmatch '0\.6\.0') { throw "Unexpected CLI version: $version" }

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: codecontext-dist-windows
          path: build/install/codecontext/
