name: Platform Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS x64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Build distribution on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon installDist

      - name: Verify CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./build/install/codecontext/bin/codecontext --version | grep -F '0.6.0'
          ./build/install/codecontext/bin/codecontext --help >/dev/null

      - name: Verify Unix release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="codecontext-0.6.0-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C build/install codecontext
          tar -tzf "$archive" | grep -F 'codecontext/bin/codecontext'

      - name: Build distribution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon installDist

      - name: Verify CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (& .\build\install\codecontext\bin\codecontext.bat --version).Trim()
          if ($version -notmatch '0\.6\.0') { throw "Unexpected CLI version: $version" }
          & .\build\install\codecontext\bin\codecontext.bat --help | Out-Null

      - name: Verify Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "codecontext-0.6.0-Windows-x64.zip"
          Compress-Archive -Path .\build\install\codecontext -DestinationPath $archive
          if (-not (Test-Path $archive)) { throw "Archive was not created" }
