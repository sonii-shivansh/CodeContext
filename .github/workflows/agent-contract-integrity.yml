name: Agent Contract Integrity E2E

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  TARGET_REPOSITORY: spring-projects/spring-petclinic
  TARGET_REF: main

jobs:
  contract-integrity:
    name: Immutable contract lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout Vericore
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build Vericore
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean test installDist

      - name: Clone target repository
        run: |
          git clone --depth 50 --branch "$TARGET_REF" "https://github.com/$TARGET_REPOSITORY.git" "$RUNNER_TEMP/target"
          cd "$RUNNER_TEMP/target"
          git rev-parse HEAD > "$RUNNER_TEMP/original-head"
          test -z "$(git status --porcelain)"

      - name: Prepare canonical contract
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          "$CLI" prepare "Improve the repository safely"
          test -s output/engineering-plan.json
          test -s output/agent-change-contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path('output/agent-change-contract.json').read_bytes()
          contract=json.loads(raw)
          assert contract.get('fingerprint') and len(contract['fingerprint']) == 64
          assert contract.get('repository')
          assert contract.get('preparedHead')
          Path('/tmp/contract-before.json').write_bytes(raw)
          PY

      - name: Verify MCP returns the persisted contract exactly
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"contract-integrity","version":"1.0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"vericore_get_change_contract","arguments":{"repoPath":"."}}}' \
            | "$CLI" mcp > output/contract-mcp.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          responses=[json.loads(x) for x in Path('output/contract-mcp.jsonl').read_text().splitlines() if x.strip()]
          response=next(r for r in responses if r.get('id') == 2)
          result=response.get('result')
          assert result and result.get('isError') is False, response
          text=''.join(x.get('text','') for x in result.get('content',[]))
          returned=json.loads(text)
          persisted=json.loads(Path('output/agent-change-contract.json').read_text())
          assert returned == persisted, (returned, persisted)
          PY

      - name: Reject contract tampering
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          cp output/agent-change-contract.json "$RUNNER_TEMP/contract.json"
          python3 - <<'PY'
          import json
          p=json.load(open('output/agent-change-contract.json'))
          p['plannedPaths'] = list(p.get('plannedPaths', [])) + ['contract-integrity-tampered.txt']
          json.dump(p, open('output/agent-change-contract.json','w'), indent=2)
          PY
          set +e
          "$CLI" verify --output output/tampered-contract.json > "$RUNNER_TEMP/tamper.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Verification failed' "$RUNNER_TEMP/tamper.log"
          cp "$RUNNER_TEMP/contract.json" output/agent-change-contract.json

      - name: Reject plan mismatch
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          cp output/engineering-plan.json "$RUNNER_TEMP/plan.json"
          python3 - <<'PY'
          import json
          p=json.load(open('output/engineering-plan.json'))
          p['changeSummary'] = 'Tampered plan that was never prepared'
          json.dump(p, open('output/engineering-plan.json','w'), indent=2)
          PY
          set +e
          "$CLI" verify --output output/mismatched-plan.json > "$RUNNER_TEMP/plan-mismatch.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Verification failed' "$RUNNER_TEMP/plan-mismatch.log"
          cp "$RUNNER_TEMP/plan.json" output/engineering-plan.json

      - name: Reject stale prepared HEAD
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          git config user.name 'Vericore Release Gate'
          git config user.email 'vericore-release-gate@example.invalid'
          printf '%s\n' 'temporary contract-integrity mutation' > contract-integrity-head-change.txt
          git add contract-integrity-head-change.txt
          git commit -m 'test: simulate stale prepared head'
          set +e
          "$CLI" verify --output output/stale-head.json > "$RUNNER_TEMP/stale-head.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'Verification failed' "$RUNNER_TEMP/stale-head.log"
          original=$(cat "$RUNNER_TEMP/original-head")
          git reset --hard "$original"
          rm -f contract-integrity-head-change.txt
          test "$(git rev-parse HEAD)" = "$original"
          test -z "$(git status --porcelain)"

      - name: Final canonical verification
        working-directory: ${{ runner.temp }}/target
        run: |
          CLI="$GITHUB_WORKSPACE/build/install/vericore/bin/vericore"
          "$CLI" verify --output output/final-contract-verification.json
          test -s output/final-contract-verification.json
          grep -q '"valid": true' output/final-contract-verification.json
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/original-head")"
          test -z "$(git status --porcelain)"

      - name: Upload contract-integrity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vericore-agent-contract-integrity-e2e
          if-no-files-found: ignore
          path: ${{ runner.temp }}/target/output/
