version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-gradle-updates:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "io.ktor*"
          - "io.kotest*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
